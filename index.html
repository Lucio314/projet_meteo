<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Météo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">

    <header class="header">
      <h1 id="main-title">Météo</h1>
    </header>

    <!-- Barre de recherche -->
    <div class="search-bar">
      <input type="text" id="city-input" placeholder="Rechercher une ville..." />
      <span class="separator">ou</span>
      <input type="number" id="lat-input" placeholder="Latitude" min="-90" max="90" step="0.0001" />
      <input type="number" id="lon-input" placeholder="Longitude" min="-180" max="180" step="0.0001" />
      <button id="btn-add-location">Ajouter</button>
    </div>

    <!-- Onglets -->
    <div id="tabs" class="tabs"></div>

    <section class="current-weather">
      <div id="current"></div>
    </section>

    <section class="daily-row">
      <div id="daily"></div>
    </section>

    <section class="hourly-list">
      <div id="hourly"></div>
    </section>

    <section class="chart-container">
      <canvas id="chart"></canvas>
    </section>

  </div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
